<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fișa disciplinei — FSSA</title>
<style>
:root { --ink: #1d2733; --muted: #6b7684; --line: #d9dee5; --bg: #f3f5f8; --card: #fff; --acc: #1f5f9f; --bad: #b3261e; --warn: #9a6700; --good: #1a7f37; }
* { box-sizing: border-box; }
body { margin: 0; font: 14px/1.45 "Segoe UI", system-ui, -apple-system, Arial, sans-serif; color: var(--ink); background: var(--bg); }
#nav { display: flex; align-items: center; gap: 14px; padding: 8px 18px; background: #16324f; color: #fff; position: sticky; top: 0; z-index: 5; flex-wrap: wrap; }
#nav a { color: #dce7f3; text-decoration: none; padding: 4px 6px; border-radius: 4px; }
#nav a:hover { background: rgba(255,255,255,.12); }
#nav .brand { font-weight: 600; margin-right: 8px; }
#nav .spacer { flex: 1; }
#nav .who small { color: #a9bdd2; }
#nav a.small { font-size: 12px; }
#app { max-width: 1180px; margin: 16px auto 120px; padding: 0 12px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 18px 22px; margin-bottom: 14px; }
.card.narrow { max-width: 720px; margin: 40px auto; }
h1 { font-size: 20px; margin: 0 0 8px; }
h2 { font-size: 16px; margin: 22px 0 8px; padding-bottom: 4px; border-bottom: 1px solid var(--line); }
h3 { font-size: 14px; margin: 14px 0 6px; }
.muted { color: var(--muted); } .small { font-size: 12px; } .warn { color: var(--warn); } .bad { color: var(--bad); } .good { color: var(--good); } .warnc { color: var(--warn); }
code { background: #eef1f5; padding: 1px 4px; border-radius: 3px; font-size: 12px; }
button, .btn { font: inherit; padding: 6px 12px; border: 1px solid #b8c2cf; border-radius: 5px; background: #fff; color: var(--ink); cursor: pointer; text-decoration: none; display: inline-block; }
button:hover, .btn:hover { background: #eef2f7; }
button.primary { background: var(--acc); border-color: var(--acc); color: #fff; } button.primary:hover { background: #184b7e; }
button.small { padding: 3px 8px; font-size: 12px; } button.x { padding: 1px 6px; color: var(--bad); border-color: transparent; }
button:disabled { opacity: .5; cursor: default; }
button.hl { outline: 2px solid var(--acc); }
.ident h3 { margin: 12px 0 4px; } .ident button { margin: 3px 4px 3px 0; }
table { border-collapse: collapse; width: 100%; }
table.grid th, table.grid td { border-bottom: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; }
table.grid th { background: #f7f9fb; font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .02em; }
table.kv th { width: 24%; text-align: left; font-weight: 600; padding: 6px 8px; vertical-align: top; background: #f7f9fb; border: 1px solid var(--line); }
table.kv th.sub { font-weight: normal; padding-left: 20px; background: #fbfcfd; }
table.kv td { padding: 6px 8px; border: 1px solid var(--line); vertical-align: top; }
td.locked { background: #f4f6f8; color: #333; }
textarea, input:not([type=checkbox]), select { font: inherit; width: 100%; padding: 5px 7px; border: 1px solid #b8c2cf; border-radius: 4px; background: #fff; }
textarea { resize: vertical; }
input.num { width: 6em; } input[type=number] { width: 6em; }
textarea:disabled, input:disabled, select:disabled { background: #f4f6f8; color: #444; }
.chklist { display: flex; flex-direction: column; gap: 3px; }
label.chk { display: block; padding: 2px 0; } label.chk input { margin-right: 6px; }
.cgroup { margin: 6px 0 10px; } .cgroup b { display: block; margin-bottom: 3px; }
.rrow { margin-bottom: 8px; padding: 4px 8px; border-left: 3px solid #d9dee5; }
table.rows th, table.rows td { border: 1px solid var(--line); padding: 4px 6px; vertical-align: top; }
table.rows th { background: #f7f9fb; text-align: left; font-weight: 600; }
.ehead { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.st { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; background: #e6e9ee; }
.st-lipsa { background: #f1f1f1; color: #666; } .st-ciorna { background: #fff3cd; color: #7a5a00; } .st-trimisa { background: #d9e8fb; color: #174a7c; } .st-obs { background: #fde2e1; color: #8a1c16; } .st-avizata { background: #d7f0dd; color: #155a2a; }
.bar { position: fixed; left: 0; right: 0; bottom: 0; background: #fff; border-top: 1px solid var(--line); padding: 8px 18px; box-shadow: 0 -2px 10px rgba(0,0,0,.06); z-index: 4; }
.bar .actions { float: right; display: flex; gap: 8px; }
.bar .vsum { padding: 6px 0; }
.bar .vlist { display: none; max-height: 30vh; overflow: auto; font-size: 13px; clear: both; padding-top: 4px; }
.bar .vlist.open { display: block; }
.verif textarea { margin-top: 8px; }
ul.hist { padding-left: 18px; } ul.compact { columns: 2; font-size: 13px; }
.counts .st { margin-right: 4px; } .filters select { width: auto; margin-right: 6px; }
#toasts { position: fixed; top: 54px; right: 16px; z-index: 20; display: flex; flex-direction: column; gap: 6px; }
.toast { background: #1d2733; color: #fff; padding: 8px 14px; border-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,.2); max-width: 420px; }
.toast.error { background: var(--bad); }
@media print { #nav, .bar, #toasts { display: none; } .card { border: none; } }
@media (max-width: 760px) { table.kv th { width: 38%; } .bar .actions { float: none; margin-bottom: 6px; } ul.compact { columns: 1; } }
.ri { margin: 0 0 6px 26px; padding-left: 8px; border-left: 2px solid #e3e7ec; } .ri label.chk { padding: 0; }
.profil { background: #f7f9fb; padding: 8px 10px; border-radius: 6px; }
.import-box { background: #fff8e1; border: 1px solid #f1d98a; border-radius: 6px; padding: 8px 12px; margin: 8px 0; }
pre.log { background: #0f172a; color: #e2e8f0; padding: 8px 10px; border-radius: 6px; max-height: 260px; overflow: auto; font-size: 12px; white-space: pre-wrap; }
button.danger { background: var(--bad); border-color: var(--bad); color: #fff; }

</style>
</head>
<body>
<div id="nav"></div>
<div id="app"></div>
<div id="toasts"></div>

<script>
/* FisaDisciplinei — build 2026-10-20 */
/* Adaptoare de stocare. Toate lucrează cu căi relative la rădăcina bibliotecii
   („FSSA – Fișe disciplină 2026/”), cu separatorul „/”.
   - FSStorage : File System Access API (Edge/Chrome), mod local — un folder sincronizat cu OneDrive
   - MemStorage: în memorie, pentru teste automate și demonstrații
   - (Faza 3) GraphStorage: Microsoft Graph → biblioteca SharePoint, același contract. */

const normPath = (p) => (p || '').split('/').filter(Boolean).join('/');

class MemStorage {
  constructor(seed) {
    this.files = new Map();   // cale -> string | ArrayBuffer
    this.dirs = new Set();
    if (seed) for (const [p, v] of Object.entries(seed)) this._put(normPath(p), v);
  }
  _put(p, v) {
    this.files.set(p, v);
    const parts = p.split('/');
    for (let i = 1; i < parts.length; i++) this.dirs.add(parts.slice(0, i).join('/'));
  }
  async list(dir) {
    dir = normPath(dir);
    const pre = dir ? dir + '/' : '';
    const out = new Map();
    for (const p of this.files.keys()) {
      if (!p.startsWith(pre)) continue;
      const rest = p.slice(pre.length);
      const i = rest.indexOf('/');
      if (i < 0) out.set(rest, 'file'); else out.set(rest.slice(0, i), 'dir');
    }
    for (const d of this.dirs) {
      if (!d.startsWith(pre) || d === dir) continue;
      const rest = d.slice(pre.length);
      if (!rest.includes('/')) out.set(rest, 'dir');
    }
    return [...out].map(([name, kind]) => ({ name, kind })).sort((a, b) => a.name.localeCompare(b.name));
  }
  async exists(p) { p = normPath(p); return this.files.has(p) || this.dirs.has(p); }
  async readText(p) {
    const v = this.files.get(normPath(p));
    if (v == null) throw new Error('Fișier inexistent: ' + p);
    return typeof v === 'string' ? v : new TextDecoder().decode(v);
  }
  async readBinary(p) {
    const v = this.files.get(normPath(p));
    if (v == null) throw new Error('Fișier inexistent: ' + p);
    return typeof v === 'string' ? new TextEncoder().encode(v).buffer : v;
  }
  async writeText(p, text) { this._put(normPath(p), text); }
  async writeBinary(p, buf) { this._put(normPath(p), buf); }
  async mkdir(p) { p = normPath(p); const parts = p.split('/'); for (let i = 1; i <= parts.length; i++) this.dirs.add(parts.slice(0, i).join('/')); }
  async remove(p) { this.files.delete(normPath(p)); }
}

class FSStorage {
  constructor(rootHandle) { this.root = rootHandle; this.name = rootHandle.name; }
  static async pick() {
    if (!window.showDirectoryPicker) throw new Error('Browserul nu are File System Access API (folosiți Edge sau Chrome).');
    const h = await window.showDirectoryPicker({ mode: 'readwrite', id: 'fise-fssa' });
    return new FSStorage(h);
  }
  async _dir(path, create = false) {
    let h = this.root;
    for (const seg of normPath(path).split('/').filter(Boolean)) h = await h.getDirectoryHandle(seg, { create });
    return h;
  }
  async _file(path, create = false) {
    const parts = normPath(path).split('/');
    const d = await this._dir(parts.slice(0, -1).join('/'), create);
    return d.getFileHandle(parts[parts.length - 1], { create });
  }
  async list(dir) {
    const out = [];
    let h;
    try { h = await this._dir(dir); } catch { return out; }
    for await (const [name, handle] of h.entries()) out.push({ name, kind: handle.kind === 'directory' ? 'dir' : 'file' });
    return out.sort((a, b) => a.name.localeCompare(b.name));
  }
  async exists(p) {
    const parts = normPath(p).split('/');
    try {
      const d = await this._dir(parts.slice(0, -1).join('/'));
      try { await d.getFileHandle(parts[parts.length - 1]); return true; } catch { }
      try { await d.getDirectoryHandle(parts[parts.length - 1]); return true; } catch { }
    } catch { }
    return false;
  }
  async readText(p) { const f = await this._file(p); return (await f.getFile()).text(); }
  async readBinary(p) { const f = await this._file(p); return (await f.getFile()).arrayBuffer(); }
  async writeText(p, text) { const f = await this._file(p, true); const w = await f.createWritable(); await w.write(text); await w.close(); }
  async writeBinary(p, buf) { const f = await this._file(p, true); const w = await f.createWritable(); await w.write(buf); await w.close(); }
  async mkdir(p) { await this._dir(p, true); }
  async remove(p) {
    const parts = normPath(p).split('/');
    const d = await this._dir(parts.slice(0, -1).join('/'));
    await d.removeEntry(parts[parts.length - 1]);
  }
}

window.Storage_ = { MemStorage, FSStorage, normPath };

/* Modelul de date: referința (00_Referinta), fișele așteptate, calculele din plan, validările. */

const REF = {};              // referința încărcată
const SCHEMA = 1;

const Model = {
  REF,

  async loadReference(st) {
    const J = async (p) => JSON.parse(await st.readText(p));
    REF.reguli = await J('00_Referinta/reguli.json');
    REF.persoane = (await J('00_Referinta/persoane.json')).persoane;
    REF.pers = Object.fromEntries(REF.persoane.map((p) => [p.key, p]));
    REF.fise = (await J('00_Referinta/fise_asteptate.json')).fise;
    REF.planuri = {}; REF.grile = {}; REF.disc = {};
    for (const p of Object.keys(REF.reguli.programe)) {
      REF.planuri[p] = await J(`00_Referinta/planuri/${p}.json`);
      try { REF.grile[p] = await J(`00_Referinta/grile/${p}.json`); } catch { REF.grile[p] = null; }
      for (const d of REF.planuri[p].discipline) REF.disc[d.id] = d;
    }
    try { REF.incarcare = (await J('00_Referinta/incarcare/2026-2027.json')).intrari; } catch { REF.incarcare = []; }
    REF.repartizare = {};
    for (const dep of Object.keys(REF.reguli.departamente)) {
      try { REF.repartizare[dep] = await J(`_Repartizare/${dep}.json`); } catch { REF.repartizare[dep] = { departament: dep, atribuiri: {} }; }
      REF.repartizare[dep].atribuiri = REF.repartizare[dep].atribuiri || {};
    }
    REF.roluri = REF.reguli.roluri || { decan: null, directori: {}, secretariat: [] };
  },

  /* ---------- persoane și roluri ---------- */
  rolOf(key) {
    const r = REF.roluri;
    if (key === r.decan) return { rol: 'decan', dep: null };
    for (const [dep, k] of Object.entries(r.directori || {})) if (k === key) return { rol: 'director', dep };
    if ((r.secretariat || []).includes(key)) return { rol: 'secretariat', dep: null };
    const p = REF.pers[key];
    return { rol: 'cadru', dep: p ? p.departament : null };
  },
  numeOf(key) { const p = REF.pers[key]; return p ? (p.afisare || key) : (key || ''); },
  isAsociat(key) { const p = REF.pers[key]; return !!(p && p.asociat); },
  /* departamentul în al cărui folder stă fișa unei persoane pentru o disciplină */
  depForFisa(key, discId) {
    const p = REF.pers[key];
    if (!p) return null;
    if (p.departament) return p.departament;
    const hit = REF.incarcare.find((e) => e.persoana === key && (e.potriviri || []).some((m) => m.id_plan === discId));
    if (hit) return hit.departament;
    return (p.departamente_predare || [])[0] || null;
  },
  folderOf(key, discId) {
    const dep = Model.depForFisa(key, discId);
    if (!dep) return null;
    return Model.isAsociat(key) ? `${dep}/_Asociati/${key}` : `${dep}/${key}`;
  },
  persoaneDep(dep) {
    return REF.persoane.filter((p) => p.key && !p.key.includes('vacant') &&
      (p.departament === dep || (p.asociat && (p.departamente_predare || []).includes(dep))));
  },

  /* ---------- fișele așteptate ---------- */
  ownerOf(f) {
    for (const dep of Object.keys(REF.repartizare)) {
      const a = REF.repartizare[dep].atribuiri[f.id];
      if (a && a.titular) return { key: a.titular, sursa: `repartizare ${dep}`, aplicatii: a.titulari_aplicatii || f.titulari_aplicatii || [] };
    }
    return { key: f.titular_curs || null, sursa: f.sursa_titular || '', aplicatii: f.titulari_aplicatii || [] };
  },
  inAfara(f) { return (f.nota || '').startsWith('fără cadru FSSA') || (f.nota || '').includes('în afara aplicației'); },
  /* lista fișelor (una pe semestru) */
  expectedFise() {
    const out = [];
    for (const f of REF.fise) {
      if (f.fara_fisa) continue;
      const d = REF.disc[f.id];
      if (!d) continue;
      const own = Model.ownerOf(f);
      for (const s of f.semestre) {
        const sem = d.semestre[String(s)];
        if (!sem) continue;
        const dep = own.key ? Model.depForFisa(own.key, f.id) : null;
        out.push({
          id: `${f.id}__A${sem.an}S${s}`, disciplina_id: f.id, program: f.program, cod: f.cod, denumire: f.denumire,
          an: sem.an, semestru: s, titular: own.key, sursa_titular: own.sursa, titulari_aplicatii: own.aplicatii,
          dep, folder: own.key ? Model.folderOf(own.key, f.id) : null, in_afara: Model.inAfara(f) && !own.key, nota: f.nota || '',
          optionalitate: f.optionalitate, pachet: f.pachet, varianta: f.varianta,
        });
      }
    }
    return out;
  },

  /* ---------- calcule din plan ---------- */
  semData(discId, s) {
    const d = REF.disc[discId];
    const sem = d.semestre[String(s)];
    const od = ((REF.reguli.ore_pe_saptamana || {}).saptamani_OD || {})[d.program];
    const weeks = (od && od[String(s)]) || 14;
    const C = sem.C || 0, S = sem.S || 0, L = sem.L || 0, A = sem.A || 0, P = sem.P || 0;
    const apl = S + L + A + P, total = C + apl, ects = sem.ECTS || 0;
    const totalSem = ects * (REF.reguli.ects_ore || 28);
    const tipuriApl = ['S', 'L', 'A', 'P'].filter((t) => sem[t] > 0);
    const TIP = Model.TIP_NAME;
    return {
      an: sem.an, anRoman: Model.roman(sem.an), semestru: s, C, S, L, A, P, apl, total, ects, weeks, forma: sem.forma_evaluare || '',
      formaText: (REF.reguli.forme_evaluare || {})[sem.forma_evaluare] ? (REF.reguli.forme_evaluare[sem.forma_evaluare].split(' (')[0]) : (sem.forma_evaluare || ''),
      perWeek: { total: total / weeks, C: C / weeks, S: S / weeks, L: L / weeks, A: A / weeks, P: P / weeks, apl: apl / weeks },
      totalSem, studiuIndividual: totalSem - total,
      regim: [d.categorie_formativa, d.optionalitate].filter(Boolean).join(' / '),
      tipuriApl,
      etichetaApl: tipuriApl.length ? tipuriApl.map((t) => TIP[t]).join('/') : 'seminar/laborator/aplicații/proiect',
      aplText: tipuriApl.length ? tipuriApl.map((t) => Model.fmt(sem[t])).join('/') : '0',
      aplSaptText: tipuriApl.length ? tipuriApl.map((t) => Model.fmt(sem[t] / weeks)).join('/') : '0',
    };
  },
  TIP_NAME: { S: 'seminar', L: 'laborator', A: 'aplicații', P: 'proiect' },
  roman(n) { return ['', 'I', 'II', 'III', 'IV', 'V', 'VI'][n] || String(n); },
  titulaturaOf(key) {
    const p = REF.pers[key];
    if (!p) return key || '';
    return (REF.profiluri && REF.profiluri[key]) || p.titulatura || p.afisare || key;
  },
  fmt(x) {
    if (x == null || isNaN(x)) return '';
    const r = Math.round(x * 100) / 100;
    return String(r).replace('.', ',');
  },
  breakdown(vals, keys = ['S', 'L', 'A', 'P']) {
    const parts = keys.filter((k) => vals[k] > 0).map((k) => `${k} ${Model.fmt(vals[k])}`);
    const sum = keys.reduce((a, k) => a + (vals[k] || 0), 0);
    return parts.length > 1 ? `${Model.fmt(sum)} (${parts.join(' / ')})` : (parts.length === 1 ? `${Model.fmt(sum)} (${parts[0]})` : '0');
  },

  /* ---------- grila: competențe și rezultate pentru o disciplină ---------- */
  grila(discId) {
    const d = REF.disc[discId];
    const g = REF.grile[d.program];
    if (!g) return { tip: 'lipsa', comp: { cheie: [], transversale: [], profesionale: [] }, rezultate: [], randuri: [], toate: false };
    if (g.tip === 'licenta') {
      let rowNames = (g.index_disciplina || {})[discId] || [];
      let toate = false;
      if (!rowNames.length && g.randuri_propuse && g.randuri_propuse[discId]) rowNames = g.randuri_propuse[discId].randuri;
      if (!rowNames.length) { rowNames = g.randuri.map((r) => `rând ${r.nr}`); toate = true; }
      const rows = g.randuri.filter((r) => rowNames.includes(`rând ${r.nr}`));
      const dict = g.dictionar_competente || {};
      const comp = { cheie: [], transversale: [], profesionale: [] };
      const seen = new Set();
      for (const r of rows) for (const grp of ['cheie', 'transversale', 'profesionale'])
        for (const c of (r.competente || {})[grp] || []) {
          if (seen.has(c.cod)) continue;
          seen.add(c.cod);
          const t = dict[c.cod] || {};
          comp[grp].push({ cod: c.cod, denumire: t.denumire || c.text || '', descriere: t.descriere || '', rand: r.nr });
        }
      const rezultate = rows.map((r) => ({ rand: r.nr, cunostinte: r.cunostinte, aptitudini: r.aptitudini, responsabilitate: r.responsabilitate }));
      return { tip: 'licenta', comp, rezultate, randuri: rowNames, toate };
    }
    // master: competențe C1.1 … C4.1 cu RÎ, rezultatele calificării militare
    let codes = (g.index_disciplina || {})[discId] || [];
    let toate = false;
    if (!codes.length) { toate = true; codes = g.competente.map((c) => c.cod).concat(g.rezultate_calificare_militara.map((c) => c.cod)); }
    const comp = { cheie: [], transversale: [], profesionale: [] };
    const rezultate = [];
    for (const c of g.competente) {
      if (!codes.includes(c.cod)) continue;
      const grp = c.cod.startsWith('C1.') ? 'cheie' : c.cod.startsWith('C2.') ? 'transversale' : 'profesionale';
      comp[grp].push({ cod: c.cod, denumire: c.denumire, descriere: '', ri: c.rezultate || [] });
      for (const ri of c.rezultate || []) rezultate.push({ cod: c.cod, text: ri, tip: 'RI' });
    }
    for (const r of g.rezultate_calificare_militara || []) if (codes.includes(r.cod)) rezultate.push({ cod: r.cod, text: r.text, tip: 'NMQ' });
    return { tip: 'master', comp, rezultate, randuri: codes, toate, nivel: g.nivel_cnc };
  },

  /* discipline din semestre anterioare ale aceluiași program (pentru 4.1) */
  preconditiiPosibile(discId, s) {
    const d = REF.disc[discId];
    return REF.planuri[d.program].discipline
      .filter((x) => x.id !== discId && Object.keys(x.semestre).length && Math.max(...Object.keys(x.semestre).map(Number)) < s)
      .map((x) => ({ id: x.id, denumire: x.denumire, sem: Object.keys(x.semestre).map(Number) }));
  },

  /* ---------- documentul fișei ---------- */
  newDoc(fx) {
    const sd = Model.semData(fx.disciplina_id, fx.semestru);
    const T = REF.reguli.texte || {};
    return {
      schema: SCHEMA, id: fx.id, program: fx.program, disciplina_id: fx.disciplina_id, cod: fx.cod, denumire: fx.denumire,
      an: fx.an, semestru: fx.semestru, titular_curs: fx.titular, titulari_aplicatii: fx.titulari_aplicatii || [],
      stare: 'ciornă', creat_la: new Date().toISOString(), modificat_la: null, modificat_de: null, trimisa_la: null,
      importat_din: null, rubrici_importate: [], verificate: [],
      date: {
        fond_timp: [null, null, null, null, null, null],
        preconditii_curriculum: [], preconditii_competente: '',
        conditii_curs: 'Sală de curs dotată cu videoproiector și tablă.', conditii_apl: sd.apl ? 'Sală de seminar / laborator de specialitate.' : '',
        competente: { cheie: [], transversale: [], profesionale: [] },
        competente_nota: '',
        obiectiv_general_text: '', obiective_generale: [], obiective_specifice_text: '', obiective_specifice: [], rezultate: [],
        rezultate_specifice: { cunostinte: '', aptitudini: '', responsabilitate: '' },
        fond_timp_alte: 'consultații',
        curs: [], bibliografie_curs: '', aplicatii: [], bibliografie_aplicatii: '',
        corelare: T.corelare_beneficiari || '',
        evaluare: { curs: { criterii: '', metode: '', pondere: null }, apl: { criterii: '', metode: '', pondere: null }, standard_minim: '' },
      },
    };
  },
  upgrade(doc) {
    const fresh = Model.newDoc(doc).date;
    if (!doc.date) doc.date = fresh;
    for (const k of Object.keys(fresh)) if (doc.date[k] === undefined) doc.date[k] = fresh[k];
    return doc;
  },

  /* ---------- validări (spec §10) ---------- */
  validate(doc, ctx = {}) {
    const E = [], W = [];
    const sd = Model.semData(doc.disciplina_id, doc.semestru);
    const D = doc.date;
    const num = (x) => (x === '' || x == null ? 0 : Number(x) || 0);
    const sumCurs = (D.curs || []).reduce((a, r) => a + num(r.ore), 0);
    if (sumCurs !== sd.C) E.push(`8.1: suma orelor de curs (${sumCurs}) ≠ orele de curs din plan (${sd.C})`);
    for (const t of ['S', 'L', 'A', 'P']) {
      const s = (D.aplicatii || []).filter((r) => r.tip === t).reduce((a, r) => a + num(r.ore), 0);
      if (s !== (sd[t] || 0)) E.push(`8.2: suma orelor de tip ${t} (${s}) ≠ plan (${sd[t] || 0})`);
    }
    const ft = (D.fond_timp || []).reduce((a, x) => a + num(x), 0);
    if (ft !== sd.studiuIndividual) E.push(`Distribuția fondului de timp: suma (${ft}) ≠ 3.7 total ore studiu individual (${sd.studiuIndividual})`);
    const pc = num(D.evaluare.curs.pondere), pa = num(D.evaluare.apl.pondere);
    if (pc + pa !== 100) E.push(`10: ponderile (${pc} + ${pa}) ≠ 100 %`);
    if (!sd.apl && pa) E.push('10.2: disciplina nu are ore de seminar/laborator/aplicații/proiect, dar are pondere la 10.2');
    const og = (D.obiective_generale || []).length, os = (D.obiective_specifice || []).length;
    if (!og) E.push('7.1: niciun obiectiv general bifat'); else if (og > 3) E.push(`7.1: ${og} obiective bifate (maximum 3)`);
    if (!os) E.push('7.2: niciun obiectiv specific bifat'); else if (os > 3) E.push(`7.2: ${os} obiective bifate (maximum 3)`);
    const nc = ['cheie', 'transversale', 'profesionale'].reduce((a, g) => a + ((D.competente || {})[g] || []).length, 0);
    if (!nc) E.push('6: nicio competență bifată');
    const gt = Model.grila(doc.disciplina_id);
    if (gt.tip === 'licenta' && !(D.rezultate || []).length) W.push('7.2: niciun rezultat al învățării din grilă bifat');
    if (!(D.obiectiv_general_text || '').trim()) W.push('7.1: obiectivul general al disciplinei (textul propriu) este gol');
    if (!(D.obiective_specifice_text || '').trim()) W.push('7.2: obiectivele specifice ale disciplinei (textul propriu) sunt goale');
    if (['cunostinte', 'aptitudini', 'responsabilitate'].some((k) => !((D.rezultate_specifice || {})[k] || '').trim())) W.push('7.2: rezultatele specifice disciplinei (cunoștințe / aptitudini / responsabilitate) nu sunt toate completate');
    const okPre = new Set(Model.preconditiiPosibile(doc.disciplina_id, doc.semestru).map((x) => x.id));
    for (const id of D.preconditii_curriculum || []) if (!okPre.has(id)) E.push(`4.1: „${(REF.disc[id] || {}).denumire || id}” nu este din semestre anterioare ale aceluiași program`);
    if (!(D.bibliografie_curs || '').trim()) E.push('8.1: bibliografia este goală');
    if (sd.apl && !(D.aplicatii || []).length) E.push('8.2: disciplina are ore de seminar/laborator/aplicații/proiect, dar nu are nicio temă');
    if (!(D.curs || []).length && sd.C) E.push('8.1: nicio temă de curs');
    if (!(D.evaluare.standard_minim || '').trim()) W.push('10.3: standardul minim de performanță este gol');
    if (doc.importat_din && (doc.rubrici_importate || []).some((r) => !(doc.verificate || []).includes(r)))
      E.push('fișă importată: rubricile preluate automat nu sunt toate marcate „verificat”');
    // avertismente
    const restr = REF.reguli.bibliografie_acces_restrictionat || [];
    const bib = `${D.bibliografie_curs || ''}\n${D.bibliografie_aplicatii || ''}`.toLowerCase();
    for (const t of restr) if (bib.includes(t.toLowerCase())) W.push(`bibliografie: „${t}” este pe lista publicațiilor cu acces restricționat`);
    if (sd.ects && sd.total / sd.ects > 14) W.push(`3.4 / 3.9 = ${Model.fmt(sd.total / sd.ects)} ore pe credit (> 14; informativ)`);
    if (ctx.alteTeme) {
      const mine = new Set([...(D.curs || []), ...(D.aplicatii || [])].map((r) => (r.tema || '').trim().toLowerCase()).filter((t) => t.length > 8));
      for (const [tema, unde] of Object.entries(ctx.alteTeme)) if (mine.has(tema)) W.push(`temă identică cu una din fișa ${unde}: „${tema}”`);
    }
    return { erori: E, avertismente: W };
  },

  /* starea efectivă = ce a declarat cadrul + verdictul din _Verificare */
  effectiveState(doc, verif) {
    if (!doc) return 'lipsă';
    if (doc.stare !== 'trimisă') return 'ciornă';
    if (verif && verif.verdict && verif.la && doc.trimisa_la && verif.la >= doc.trimisa_la) return verif.verdict;
    return 'trimisă';
  },
  verifPath(fx) { return `_Verificare/${fx.dep}/${fx.titular}/${fx.id}.verif.json`; },

  /* ---------- Faza 4: planul de drepturi pe foldere (matricea din spec §5), derivat din persoane.json + roluri ----------
     Părinții înaintea copiilor: la ruperea moștenirii SharePoint copiază drepturile existente ale părintelui. */
  permissionPlan() {
    const R = REF, rol = R.roluri || {};
    const deps = Object.keys(R.reguli.departamente || {});
    const upn = (k) => (R.pers[k] && R.pers[k].upn) || null;
    const staff = R.persoane.filter((p) => p.key && !p.key.includes('vacant') && !p.asociat && p.departament && p.key !== rol.decan);
    const all = staff.map((p) => upn(p.key)).filter(Boolean);
    const lipsa = staff.filter((p) => !upn(p.key)).map((p) => p.key);
    const secr = (rol.secretariat || []).map(upn).filter(Boolean);
    const plan = [];
    const add = (path, role, emails, note) => { const e = [...new Set(emails.filter(Boolean))]; if (e.length) plan.push({ path, role, emails: e, note }); };
    add('00_Referinta', 'read', all, 'toți: citire referință');
    add('00_Referinta', 'write', secr, 'secretariat: scriere referință');
    add('_Import', 'write', secr, 'secretariat');
    add('Publicate', 'read', all, 'toți');
    add('_Repartizare', 'read', all, 'toți: citire repartizări');
    for (const dep of deps) {
      const d = (rol.directori || {})[dep];
      const du = d && d !== rol.decan ? upn(d) : null;
      add(`${dep}`, 'write', [du], `director ${dep}: tot departamentul (inclusiv _Asociati)`);
      add(`_Verificare/${dep}`, 'write', [du], `director ${dep}: verdicte`);
      add(`_Repartizare/${dep}.json`, 'write', [du], `director ${dep}: repartizarea (fișierul se creează dacă lipsește)`);
    }
    for (const p of staff) {
      const u = upn(p.key); if (!u) continue;
      add(`${p.departament}/${p.key}`, 'write', [u], `${p.afisare}: folderul propriu`);
      add(`_Verificare/${p.departament}/${p.key}`, 'read', [u], `${p.afisare}: citește verdictele`);
    }
    return { plan, lipsa, conturi: all.length };
  },
};

/* Generarea .docx din șablonul programului (00_Referinta/modele/Sablon_<P>.docx) cu docxtemplater.
   Convențiile de completare urmează fișele avizate ale decanului (10.10.2026): 1.5 „Licență – 240 ECTS”, anul cu cifre romane,
   2.6 cu denumirea completă, 3.3/3.6 „14/14” cu eticheta tipurilor, rândurile TOTAL ORE, C1./S1./L1. ca prefixe de teme,
   rubrica 6 cu antetul „conform planului de învățământ…”, 7.1/7.2 cu textul propriu + obiectivele programului + rezultatele învățării. */

const XML = {
  esc: (s) => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'),
  run: (t, b) => `<w:r><w:rPr><w:rFonts w:ascii="Times New Roman" w:hAnsi="Times New Roman" w:cs="Times New Roman"/>${b ? '<w:b/><w:bCs/>' : ''}<w:sz w:val="24"/><w:szCs w:val="24"/><w:lang w:val="ro-RO"/></w:rPr><w:t xml:space="preserve">${XML.esc(t)}</w:t></w:r>`,
  p: (t, b) => `<w:p><w:pPr><w:pStyle w:val="ListParagraph"/><w:ind w:left="0"/><w:jc w:val="both"/></w:pPr>${XML.run(t, b)}</w:p>`,
  /* lines: [{t, b}] -> paragrafe; textul simplu (pentru șablonul provizoriu și teste) = liniile unite cu \n */
  paras: (lines) => lines.map((l) => XML.p(l.t, l.b)).join(''),
  plain: (lines) => lines.map((l) => l.t).join('\n'),
};

const Docx = {
  XML,
  lower1: (s) => (s ? s.charAt(0).toLowerCase() + s.slice(1) : ''),
  riText: (s) => (s || '').replace(/^RI\s*[\d.]+\s*/i, '').trim(),

  dataFor(doc, verif) {
    const R = Model.REF, D = doc.date;
    const d = R.disc[doc.disciplina_id];
    const sd = Model.semData(doc.disciplina_id, doc.semestru);
    const prog = R.reguli.programe[doc.program] || {};
    const fac = (R.reguli.facultate_pe_program || {})[doc.program] || 'FSSA';
    const dep = Model.depForFisa(doc.titular_curs, doc.disciplina_id);
    const T = R.reguli.texte || {}, TP = (T.pe_program || {})[doc.program] || {};
    const g = Model.grila(doc.disciplina_id);
    const fmt = Model.fmt, low = Docx.lower1;
    const TIP = Model.TIP_NAME;
    const lines = (t) => (t || '').split(/\r?\n/).map((x) => x.trim()).filter(Boolean);

    /* 6. competențe */
    const allComp = [...g.comp.cheie, ...g.comp.transversale, ...g.comp.profesionale];
    const find = (cod) => allComp.find((x) => x.cod === cod);
    const selRI = new Set(D.rezultate || []);
    const compLine = (cod) => {
      const c = find(cod);
      if (!c) return cod;
      let s = c.cod;
      if (g.tip === 'master' && /^C2\.(\d)$/.test(c.cod)) s += ` (T${c.cod.split('.')[1]})`;
      s += ` – ${low((c.denumire || '').replace(/\s+-\s+/g, ' '))}`;
      if (g.tip === 'master') {
        const ri = (c.ri || []).filter((r) => selRI.has(`${c.cod}|${r}`)).map((r) => low(Docx.riText(r)));
        if (ri.length) s += `: ${ri.join('; ')}`;
      }
      return s;
    };
    const antet = g.tip === 'licenta'
      ? `(conform planului de învățământ, ${g.randuri.length === 1 ? 'rândul' : 'rândurile'} ${g.randuri.map((r) => r.replace('rând ', '')).join(', ').replace(/, ([^,]*)$/, ' și $1')} din grila rezultatelor învățării)`
      : '(conform planului de învățământ, matricea competențe – discipline)';
    const compLines = (codes) => codes.map((c, i) => ({ t: compLine(c) + (i === codes.length - 1 ? '.' : ';'), b: false }));
    const transvL = [];
    if ((D.competente.transversale || []).length) transvL.push({ t: `Competențe transversale ${antet}:`, b: true }, ...compLines(D.competente.transversale));
    if ((D.competente.cheie || []).length) transvL.push({ t: `Competențe cheie ${antet}:`, b: true }, ...compLines(D.competente.cheie));
    const profL = [];
    if ((D.competente.profesionale || []).length) profL.push({ t: `Competențe profesionale ${antet}:`, b: true }, ...compLines(D.competente.profesionale));
    if ((D.competente_nota || '').trim()) profL.push(...lines(D.competente_nota).map((t) => ({ t, b: false })));

    /* 7.1 / 7.2 */
    const og = TP.obiective_generale || [], os = TP.obiective_specifice || [];
    const numbered = g.tip === 'licenta';
    const objLines = (idx, list) => { const a = idx.slice().sort((x, y) => x - y); return a.map((i, k) => ({ t: `${numbered ? `${i + 1}. ` : ''}${list[i] || ''}${k === a.length - 1 ? '.' : ';'}`, b: false })); };
    const obGL = [];
    if ((D.obiectiv_general_text || '').trim()) obGL.push(...lines(D.obiectiv_general_text).map((t) => ({ t, b: false })));
    if ((D.obiective_generale || []).length) obGL.push({ t: 'Disciplina contribuie la realizarea următoarelor obiective generale ale programului de studii:', b: false }, ...objLines(D.obiective_generale, og));
    const obSL = [];
    const ost = lines(D.obiective_specifice_text);
    if (ost.length) obSL.push({ t: 'Obiectivele specifice ale disciplinei:', b: true }, ...ost.map((x, k) => ({ t: x.replace(/[;.]\s*$/, '') + (k === ost.length - 1 ? '.' : ';'), b: false })));
    if ((D.obiective_specifice || []).length) obSL.push({ t: 'Disciplina contribuie la realizarea următoarelor obiective specifice ale programului de studii:', b: false }, ...objLines(D.obiective_specifice, os));
    const rs = D.rezultate_specifice || {};
    obSL.push({ t: 'Rezultatele învățării (conform planului de învățământ):', b: true });
    if (g.tip === 'licenta') {
      for (const [grp, lab] of [['cunostinte', 'Cunoștințe'], ['aptitudini', 'Aptitudini'], ['responsabilitate', 'Responsabilitate și autonomie']]) {
        const items = (D.rezultate || []).filter((k) => k.startsWith(grp + ':')).map((k) => Number(k.split(':')[1])).sort((a, b) => a - b);
        const spec = (rs[grp] || '').trim();
        if (!items.length && !spec) continue;
        obSL.push({ t: `${lab}:`, b: true });
        for (const n of items) { const r = g.rezultate.find((x) => x.rand === n); if (r) obSL.push({ t: `– ${r[grp]} (rândul ${n})`, b: false }); }
        if (spec) obSL.push({ t: `– Specific disciplinei: ${spec}`, b: false });
      }
    } else {
      const cnc = g.nivel || {};
      const lvl = (cnc.nivel || 'Nivelul 7').replace('Nivelul', 'nivelul');
      for (const [grp, lab, key] of [['cunostinte', 'Cunoștințe', 'cunostinte'], ['aptitudini', 'Abilități', 'abilitati'], ['responsabilitate', 'Responsabilitate și autonomie', 'responsabilitate']]) {
        obSL.push({ t: `${lab}:`, b: true });
        if (cnc[key]) obSL.push({ t: `– ${cnc[key].replace(/\s*\n\s*/g, ' ')} (${lvl} CNC)`, b: false });
        const spec = (rs[grp] || '').trim();
        if (spec) obSL.push({ t: `– Specific disciplinei: ${spec}`, b: false });
      }
      const nmq = (D.rezultate || []).filter((k) => /^C\d\.R\d/.test(k)).map((k) => g.rezultate.find((x) => `${x.cod}|${x.text}` === k)).filter(Boolean);
      if (nmq.length) obSL.push({ t: 'Rezultatele calificării militare (NMQ):', b: true }, ...nmq.map((r) => ({ t: `– ${r.text} (${r.cod})`, b: false })));
    }

    /* 4.1 */
    const preList = (D.preconditii_curriculum || []).map((id) => {
      const x = R.disc[id]; if (!x) return id;
      const sems = Object.keys(x.semestre).map(Number).sort((a, b) => a - b);
      return `${x.denumire} (sem. ${sems.length > 1 ? `${sems[0]}-${sems[sems.length - 1]}` : sems[0]})`;
    });
    const preL = preList.length ? [{ t: 'Discipline studiate anterior:', b: false }, ...preList.map((x, k) => ({ t: x + (k === preList.length - 1 ? '.' : ';'), b: false }))] : [{ t: '–', b: false }];
    /* tema: primul rând bold (titlul), restul normal; bibliografia: rândurile care se termină cu „:” sunt titluri */
    const temaL = (prefix, tema) => { const ls = lines(tema); return ls.length ? ls.map((t, i) => ({ t: i === 0 ? `${prefix}${t}` : t, b: i === 0 })) : [{ t: prefix, b: true }]; };
    const bibL = (txt) => lines(txt).map((t) => ({ t, b: /:$/.test(t) }));

    /* 8 */
    const perTip = {};
    const aplRows = (D.aplicatii || []).map((r) => {
      const t = r.tip || sd.tipuriApl[0] || 'S';
      perTip[t] = (perTip[t] || 0) + 1;
      const L = temaL(`${t}${perTip[t]}. `, r.tema);
      return { tema: XML.plain(L), tema_xml: XML.paras(L), ore: fmt(r.ore), metode: r.metode || '', obs: r.obs || '' };
    });
    const aplTotal = sd.tipuriApl.map((t) => fmt((D.aplicatii || []).filter((r) => (r.tip || sd.tipuriApl[0]) === t).reduce((a, r) => a + (Number(r.ore) || 0), 0))).join('/');

    /* persoane și semnături */
    const tit = Model.titulaturaOf(doc.titular_curs);
    const titApl = (doc.titulari_aplicatii || []).length ? doc.titulari_aplicatii.map(Model.titulaturaOf).join(', ') : (sd.apl ? tit : '–');
    const director = (R.roluri.directori || {})[dep];
    const today = new Date();
    const dmy = (dt) => `${String(dt.getDate()).padStart(2, '0')}.${String(dt.getMonth() + 1).padStart(2, '0')}.${dt.getFullYear()}`;
    const avizata = verif && verif.verdict === 'avizată' && Model.effectiveState(doc, verif) === 'avizată';
    const pct = (x) => (x != null && x !== '' ? `${x}%` : '');

    return {
      institutia: (R.reguli.institutia || 'Academia Forțelor Aeriene „Henri Coandă”').toUpperCase(),
      facultatea: (R.reguli.facultati || {})[fac] || fac,
      departamentul: (R.reguli.departamente || {})[dep] || dep || '',
      domeniul: prog.domeniu || '', ciclul: `${prog.ciclu || ''}${prog.credite ? ` – ${prog.credite} ECTS` : ''}`, programul: prog.denumire || doc.program, seria: prog.seria || '',
      denumirea: d.denumire, titular_curs: tit, titular_aplicatii: titApl,
      an: sd.anRoman, semestru: String(sd.semestru), evaluare: sd.formaText, regim: sd.regim,
      ore_sapt: fmt(sd.perWeek.total), ore_sapt_curs: fmt(sd.perWeek.C), ore_sapt_apl: sd.aplSaptText, eticheta_apl: sd.etichetaApl, eticheta_apl_caps: sd.etichetaApl.toUpperCase().replace(/\//g, ' / '),
      total_plan: fmt(sd.total), total_curs: fmt(sd.C), total_apl: sd.aplText, total_apl_completat: aplTotal,
      ft1: fmt(D.fond_timp[0]), ft2: fmt(D.fond_timp[1]), ft3: fmt(D.fond_timp[2]), ft4: fmt(D.fond_timp[3]), ft5: fmt(D.fond_timp[4]), ft6: fmt(D.fond_timp[5]),
      ft6_eticheta: (D.fond_timp_alte || '').trim() ? `Alte activități – ${D.fond_timp_alte.trim()}` : 'Alte activități …',
      studiu_individual: fmt(sd.studiuIndividual), total_semestru: fmt(sd.totalSem), credite: fmt(sd.ects),
      precond_curriculum: XML.plain(preL), precond_curriculum_xml: XML.paras(preL), precond_competente: D.preconditii_competente || '–',
      cond_curs: D.conditii_curs || '', cond_apl: D.conditii_apl || (sd.apl ? '' : '–'),
      comp_transversale: XML.plain(transvL), comp_transversale_xml: XML.paras(transvL), comp_profesionale: XML.plain(profL), comp_profesionale_xml: XML.paras(profL),
      obiective_generale: XML.plain(obGL), obiective_generale_xml: XML.paras(obGL), obiective_specifice: XML.plain(obSL), obiective_specifice_xml: XML.paras(obSL),
      curs: (D.curs || []).map((r, i) => { const L = temaL(`C${i + 1}. `, r.tema); return { tema: XML.plain(L), tema_xml: XML.paras(L), ore: fmt(r.ore), metode: r.metode || '', obs: r.obs || '' }; }),
      total_curs_completat: fmt((D.curs || []).reduce((a, r) => a + (Number(r.ore) || 0), 0)),
      bibliografie_curs: D.bibliografie_curs || '', bibliografie_curs_xml: XML.paras(bibL(D.bibliografie_curs)),
      aplicatii: aplRows,
      bibliografie_aplicatii: D.bibliografie_aplicatii || '', bibliografie_aplicatii_xml: XML.paras(bibL(D.bibliografie_aplicatii)),
      corelare: D.corelare || '',
      ev_curs_criterii: D.evaluare.curs.criterii || '', ev_curs_metode: D.evaluare.curs.metode || '', ev_curs_pondere: pct(D.evaluare.curs.pondere),
      ev_apl_criterii: D.evaluare.apl.criterii || '', ev_apl_metode: D.evaluare.apl.metode || '', ev_apl_pondere: pct(D.evaluare.apl.pondere),
      standard_minim: D.evaluare.standard_minim || '',
      data_completarii: dmy(today),
      semn_titular_curs: tit, semn_titular_apl: titApl === '–' ? '' : titApl,
      data_avizarii: avizata ? dmy(new Date(verif.la)) : '',
      semn_director: director ? Model.titulaturaOf(director) : '', semn_decan: R.roluri.decan ? Model.titulaturaOf(R.roluri.decan) : '',
    };
  },

  async render(st, doc, verif) {
    const path = `00_Referinta/modele/Sablon_${doc.program}.docx`;
    let buf;
    try { buf = await st.readBinary(path); } catch { throw new Error(`Lipsește șablonul ${path}`); }
    const zip = new window.PizZip(buf);
    const tpl = new window.docxtemplater(zip, { paragraphLoop: true, linebreaks: true, nullGetter: () => '' });
    tpl.render(Docx.dataFor(doc, verif));
    const z = tpl.getZip();
    const xml = z.file('word/document.xml').asText();
    z.file('word/document.xml', xml.replace(/<w:p(?: [^>]*)?>(?:(?!<\/w:p>)[\s\S])*?<w:pStyle w:val="LoopTag"\/>(?:(?!<\/w:p>)[\s\S])*?<\/w:p>/g, ''));
    return z.generate({ type: 'arraybuffer', compression: 'DEFLATE', mimeType: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });
  },
};

window.Docx = Docx;

/* Faza 3 — stratul Microsoft Graph: autentificare M365 (MSAL.js) și adaptorul de stocare peste biblioteca SharePoint.
   Același contract ca FSStorage/MemStorage (list, exists, readText, readBinary, writeText, writeBinary, mkdir) + pdf(path).
   Configurația publică vine din window.CONFIG (config.js lângă index.html): clientId, tenantId, siteUrl, library, scopes. */

const GRAPH_DEFAULT = 'https://graph.microsoft.com/v1.0';
const encodePath = (p) => window.Storage_.normPath(p).split('/').map(encodeURIComponent).join('/');

class GraphError extends Error {
  constructor(status, message, url) { super(message); this.status = status; this.url = url; }
}

const Auth = {
  cfg: null, msal: null,
  configured(cfg) { return !!(cfg && cfg.clientId && cfg.tenantId && cfg.siteUrl && !/^<.*>$/.test(cfg.clientId)); },
  async init(cfg) {
    this.cfg = cfg;
    if (cfg.mockToken) return true;                       // teste: fără MSAL
    if (!window.msal) throw new Error('Biblioteca MSAL nu este încărcată.');
    this.msal = new window.msal.PublicClientApplication({
      auth: { clientId: cfg.clientId, authority: `https://login.microsoftonline.com/${cfg.tenantId}`, redirectUri: cfg.redirectUri || (location.origin + location.pathname) },
      cache: { cacheLocation: 'sessionStorage', storeAuthStateInCookie: false },
    });
    await this.msal.initialize();
    const res = await this.msal.handleRedirectPromise();
    if (res && res.account) this.msal.setActiveAccount(res.account);
    else { const accs = this.msal.getAllAccounts(); if (accs.length) this.msal.setActiveAccount(accs[0]); }
    return !!this.msal.getActiveAccount();
  },
  scopes() { return (this.cfg && this.cfg.scopes) || ['User.Read', 'Sites.ReadWrite.All']; },
  async login() { await this.msal.loginRedirect({ scopes: this.scopes(), prompt: 'select_account' }); },
  async token() {
    if (this.cfg.mockToken) return this.cfg.mockToken;
    try { return (await this.msal.acquireTokenSilent({ scopes: this.scopes() })).accessToken; }
    catch (e) {
      if (e instanceof window.msal.InteractionRequiredAuthError || (e.errorCode || '').includes('interaction_required') || (e.errorCode || '').includes('no_account')) { await this.msal.acquireTokenRedirect({ scopes: this.scopes() }); }
      throw e;
    }
  },
  account() { return this.cfg.mockToken ? { username: this.cfg.mockToken } : (this.msal && this.msal.getActiveAccount()); },
  async logout() { if (this.msal) await this.msal.logoutRedirect({ account: this.msal.getActiveAccount() }); else location.reload(); },
};

class GraphStorage {
  constructor(cfg) {
    this.cfg = cfg; this.base = cfg.graphBase || GRAPH_DEFAULT; this.name = cfg.library;
    this.driveId = null; this.siteId = null; this.webUrl = null;
  }
  async _headers(extra = {}) { return Object.assign({ Authorization: 'Bearer ' + (await Auth.token()) }, extra); }
  async _fetch(url, opts = {}, retry = true) {
    const res = await fetch(url, Object.assign({}, opts, { headers: Object.assign(await this._headers(), opts.headers || {}) }));
    if (res.status === 401 && retry && !this.cfg.mockToken) { return this._fetch(url, opts, false); }
    if (!res.ok) {
      let msg = `${res.status} ${res.statusText}`;
      try { const j = await res.json(); if (j.error) msg = `${res.status} ${j.error.code}: ${j.error.message}`; } catch { }
      throw new GraphError(res.status, msg, url);
    }
    return res;
  }
  async _json(url, opts) { return (await this._fetch(url, opts)).json(); }
  /* site + drive din siteUrl („https://tenant.sharepoint.com/sites/FSSA”) și numele bibliotecii */
  async init() {
    const u = new URL(this.cfg.siteUrl);
    const site = await this._json(`${this.base}/sites/${u.hostname}:${u.pathname.replace(/\/$/, '')}`);
    this.siteId = site.id; this.webUrl = site.webUrl;
    if (this.cfg.driveId) { this.driveId = this.cfg.driveId; return this; }   // configurat explicit: nu depinde de listarea bibliotecilor
    const drives = await this._json(`${this.base}/sites/${this.siteId}/drives?$select=id,name,webUrl`);
    const norm = (s) => (s || '').normalize('NFKC').replace(/[\s–—-]+/g, ' ').trim().toLowerCase();
    const d = (drives.value || []).find((x) => norm(x.name) === norm(this.cfg.library)) || (drives.value || []).find((x) => norm(x.name).includes('fișe') || norm(x.name).includes('fise'));
    if (!d) throw new Error(`Biblioteca „${this.cfg.library}” nu există pe site-ul ${this.cfg.siteUrl} (biblioteci găsite: ${(drives.value || []).map((x) => x.name).join(', ')})`);
    this.driveId = d.id; this.driveUrl = d.webUrl;
    return this;
  }
  _item(path, suffix = '') {
    const p = encodePath(path);
    return `${this.base}/drives/${this.driveId}/root${p ? `:/${p}:` : ''}${suffix}`;
  }
  async me() { return this._json(`${this.base}/me?$select=userPrincipalName,displayName,surname,givenName,mail,id`); }
  async list(dir) {
    const out = [];
    let url = this._item(dir, '/children') + '?$select=name,folder,file,size,lastModifiedDateTime,webUrl,content.downloadUrl&$top=999';
    try {
      while (url) {
        const j = await this._json(url);
        for (const it of j.value || []) out.push({ name: it.name, kind: it.folder ? 'dir' : 'file', size: it.size, modified: it.lastModifiedDateTime, downloadUrl: it['@microsoft.graph.downloadUrl'], webUrl: it.webUrl });
        url = j['@odata.nextLink'] || null;
      }
    } catch (e) { if (e.status === 404 || e.status === 403) return []; throw e; }
    return out.sort((a, b) => a.name.localeCompare(b.name));
  }
  async exists(p) { try { await this._json(this._item(p) + '?$select=id'); return true; } catch (e) { if (e.status === 404 || e.status === 403) return false; throw e; } }
  async readText(p) { return (await this._fetch(this._item(p, '/content'))).text(); }
  async readBinary(p) { return (await this._fetch(this._item(p, '/content'))).arrayBuffer(); }
  async readEntry(entry) {
    /* citire prin adresa de descărcare pre-autentificată din listare (fără antet, paralelizabilă) */
    if (!entry.downloadUrl) return null;
    const r = await fetch(entry.downloadUrl);
    if (!r.ok) throw new GraphError(r.status, 'descărcare eșuată', entry.downloadUrl);
    return r.text();
  }
  async _put(p, body, type) {
    const url = this._item(p, '/content');
    try { return await this._json(url, { method: 'PUT', body, headers: { 'Content-Type': type } }); }
    catch (e) {
      if (e.status === 404) { // folderul părinte lipsește
        const parts = window.Storage_.normPath(p).split('/');
        await this.mkdir(parts.slice(0, -1).join('/'));
        return this._json(url, { method: 'PUT', body, headers: { 'Content-Type': type } });
      }
      throw e;
    }
  }
  async writeText(p, text) { return this._put(p, text, 'text/plain; charset=utf-8'); }
  async writeBinary(p, buf) { return this._put(p, buf, 'application/octet-stream'); }
  async mkdir(p) {
    const parts = window.Storage_.normPath(p).split('/').filter(Boolean);
    let cur = '';
    for (const seg of parts) {
      const next = cur ? `${cur}/${seg}` : seg;
      if (!(await this.exists(next))) {
        try { await this._json(this._item(cur, '/children'), { method: 'POST', body: JSON.stringify({ name: seg, folder: {}, '@microsoft.graph.conflictBehavior': 'fail' }), headers: { 'Content-Type': 'application/json' } }); }
        catch (e) { if (e.status !== 409) throw e; }
      }
      cur = next;
    }
  }
  async remove(p) { await this._fetch(this._item(p), { method: 'DELETE' }); }
  /* conversia .docx -> PDF pe serverele Microsoft (fișierul trebuie să fie deja în bibliotecă) */
  async pdf(p) { return (await this._fetch(this._item(p, '/content') + '?format=pdf')).arrayBuffer(); }
  async webUrlOf(p) { try { return (await this._json(this._item(p) + '?$select=webUrl')).webUrl; } catch { return null; } }
  /* ---- administrare (decan): conturi Entra, drepturi pe foldere ---- */
  async users(filter) {
    const j = await this._json(`${this.base}/users?$filter=${encodeURIComponent(filter)}&$select=id,displayName,userPrincipalName,surname,givenName,mail,accountEnabled,jobTitle&$top=25`);
    return j.value || [];
  }
  async user(upn) { try { return await this._json(`${this.base}/users/${encodeURIComponent(upn)}?$select=id,displayName,userPrincipalName,surname,givenName,accountEnabled`); } catch (e) { if (e.status === 404) return null; throw e; } }
  /* acordă drept direct (read | write) unor conturi pe un folder/fișier; SharePoint rupe moștenirea pe element și copiază drepturile părintelui */
  async invite(p, emails, role) {
    if (!emails.length) return [];
    const body = { requireSignIn: true, sendInvitation: false, roles: [role], recipients: emails.map((e) => ({ email: e })) };
    const j = await this._json(this._item(p, '/invite'), { method: 'POST', body: JSON.stringify(body), headers: { 'Content-Type': 'application/json' } });
    return j.value || [];
  }
  async permissions(p) {
    const j = await this._json(this._item(p, '/permissions'));
    return (j.value || []).map((x) => ({ id: x.id, roles: x.roles || [], user: x.grantedToV2 && x.grantedToV2.user ? (x.grantedToV2.user.email || x.grantedToV2.user.displayName) : (x.grantedToV2 && x.grantedToV2.siteGroup ? 'grup: ' + x.grantedToV2.siteGroup.displayName : (x.grantedTo && x.grantedTo.user ? (x.grantedTo.user.email || x.grantedTo.user.displayName) : (x.link ? 'link' : '?'))), inherited: !!x.inheritedFrom }));
  }
  async removePermission(p, permId) { await this._fetch(this._item(p, `/permissions/${permId}`), { method: 'DELETE' }); }
}

/* identitatea: contul M365 -> cheia din persoane.json (UPN exact; altfel nume + prenume; altfel numele în UPN) */
function resolvePerson(me, persoane) {
  const key = window.Names ? window.Names.key : (s) => (s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z]/g, '');
  const upn = (me.userPrincipalName || me.mail || '').toLowerCase();
  const exact = persoane.filter((p) => p.upn && p.upn.toLowerCase() === upn);
  if (exact.length === 1) return { key: exact[0].key, mod: 'UPN' };
  const sn = key(me.surname || ''), gn = key((me.givenName || '').split(/[\s-]/)[0]);
  const local = key(upn.split('@')[0]);
  let cand = persoane.filter((p) => p.key && !p.key.includes('vacant') && key(p.nume) && key(p.nume) === sn);
  if (cand.length > 1 && gn) cand = cand.filter((p) => key(p.prenume || '').includes(gn));
  if (cand.length === 1) return { key: cand[0].key, mod: 'nume' };
  cand = persoane.filter((p) => p.key && !p.key.includes('vacant') && key(p.nume) && local.includes(key(p.nume)));
  if (cand.length > 1 && gn) cand = cand.filter((p) => local.includes(key((p.prenume || '').split(/[\s-]/)[0])));
  if (cand.length === 1) return { key: cand[0].key, mod: 'UPN (nume)' };
  return { key: null, candidati: cand.map((p) => p.key) };
}

async function readJson(path) { try { return JSON.parse(await state.st.readText(path)); } catch { return null; } }
async function readJsonEntry(folder, entry) {
  try {
    if (entry && entry.downloadUrl && state.st.readEntry) return JSON.parse(await state.st.readEntry(entry));
    return JSON.parse(await state.st.readText(`${folder}/${entry.name}`));
  } catch { return null; }
}
async function parallel(tasks, limit = 6) {
  const results = new Array(tasks.length); let i = 0;
  const worker = async () => { while (i < tasks.length) { const k = i++; results[k] = await tasks[k](); } };
  await Promise.all(Array.from({ length: Math.min(limit, tasks.length) }, worker));
  return results;
}
async function scanStates(list) {
  const byFolder = new Map();
  for (const fx of list) if (fx.folder) { if (!byFolder.has(fx.folder)) byFolder.set(fx.folder, []); byFolder.get(fx.folder).push(fx); }
  const out = {};
  const folders = [...byFolder];
  const listings = await parallel(folders.map(([folder, fxs]) => async () => [await state.st.list(folder), await state.st.list(`_Verificare/${fxs[0].dep}/${fxs[0].titular}`)]));
  const reads = [];
  folders.forEach(([folder, fxs], k) => {
    const [entries, ventries] = listings[k];
    const byName = Object.fromEntries(entries.map((e) => [e.name, e]));
    const vByName = Object.fromEntries(ventries.map((e) => [e.name, e]));
    const vdir = `_Verificare/${fxs[0].dep}/${fxs[0].titular}`;
    for (const fx of fxs) {
      out[fx.id] = { doc: null, verif: null, docx: !!byName[fx.id + '.docx'], pdf: !!byName[fx.id + '.pdf'], stare: 'lipsă' };
      if (byName[fx.id + '.json']) reads.push(async () => { out[fx.id].doc = await readJsonEntry(folder, byName[fx.id + '.json']); });
      if (vByName[fx.id + '.verif.json']) reads.push(async () => { out[fx.id].verif = await readJsonEntry(vdir, vByName[fx.id + '.verif.json']); });
    }
  });
  await parallel(reads, 6);
  for (const id of Object.keys(out)) out[id].stare = Model.effectiveState(out[id].doc, out[id].verif);
  for (const fx of list) if (!out[fx.id]) out[fx.id] = { doc: null, verif: null, docx: false, stare: fx.titular ? 'lipsă' : '—' };
  state.cache = Object.assign(state.cache || {}, out);
  return out;
}

      try { await state.st.writeText(Model.verifPath(fx), JSON.stringify(v, null, 1)); verif = v; state.cache[fx.id] = Object.assign(state.cache[fx.id] || {}, { verif }); toast(`Verdict scris: ${verdict}.`); renderEditor(fx, doc, verif, ctx); }
      catch (e) { toast('Nu s-a putut scrie verdictul: ' + e.message, 'error'); }
    };
    $('#v-obs').onclick = () => writeVerdict('cu observații');
    $('#v-ok').onclick = () => writeVerdict('avizată');
  }
  recalc();
}

/* ---------- administrare (decan, mod SharePoint): conturi Entra + drepturi pe foldere (Faza 4) ---------- */
const stripDia = (t) => (t || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '');
const odata = (t) => String(t).replace(/'/g, "''");
async function findAccounts(st, p) {
  /* candidați din Entra pentru o persoană: după nume (cu/fără diacritice), apoi după prenume */
  const seen = new Map();
  const tries = [`startswith(surname,'${odata(p.nume)}')`, `startswith(surname,'${odata(stripDia(p.nume))}')`, `startswith(displayName,'${odata(p.nume)}')`, `startswith(displayName,'${odata(stripDia(p.nume))}')`];
  if (p.prenume) tries.push(`startswith(givenName,'${odata((p.prenume || '').split(/[\s-]/)[0])}')`);
  for (const f of tries) {
    try { for (const u of await st.users(f)) seen.set(u.userPrincipalName, u); } catch (e) { console.warn('users', f, e.message); }
  }
  const key = (t) => stripDia(t).toLowerCase().replace(/[^a-z]/g, '');
  const sn = key(p.nume), gn = key((p.prenume || '').split(/[\s-]/)[0]);
  const scored = [...seen.values()].filter((u) => u.accountEnabled !== false).map((u) => {
    const usn = key(u.surname), ugn = key(u.givenName), udn = key(u.displayName), ul = key((u.userPrincipalName || '').split('@')[0]);
    let sc = 0;
    if (usn === sn || udn.includes(sn) || ul.includes(sn)) sc += 2;
    if (gn && (ugn === gn || udn.includes(gn) || ul.includes(gn))) sc += 1;
    return { u, sc };
  }).filter((x) => x.sc >= 2).sort((a, b) => b.sc - a.sc);
  return scored;
}

      </tbody></table>

      <p class="muted">Fiecare rând = un drept direct (<i>read</i> sau <i>write</i>) acordat prin Microsoft Graph pe folderul/fișierul respectiv; SharePoint rupe moștenirea pe element și copiază drepturile părintelui, de aceea părinții se acordă primii. Decanul este owner al site-ului și nu apare. Re-rularea este sigură (dreptul existent nu se dublează).</p>

      <table class="grid"><thead><tr><th>Cale</th><th>Drept</th><th>Conturi</th><th>Notă</th></tr></thead><tbody>

      b.disabled = true;

        const f = `_Repartizare/${dep}.json`;
        if (!(await st.exists(f))) { try { await st.writeText(f, JSON.stringify({ departament: dep, atribuiri: {} }, null, 1)); log(`creat ${f}`); } catch (e) { log(`EROARE la crearea ${f}: ${e.message}`); } }

        catch (e) { err++; log(`✖ ${x.role.padEnd(5)} ${x.path}: ${e.message}`); }

      log(`gata: ${ok} reușite, ${err} erori`);
      toast(err ? `${err} erori la acordarea drepturilor` : 'Drepturile au fost aplicate.', err ? 'error' : 'info');

        catch (e) { out.push(`<tr><td><code>${esc(p)}</code></td><td class="bad">${esc(e.message)}</td></tr>`); }
      }
      $('#a-audit-out').innerHTML = `<h3>Drepturi existente</h3><table class="grid"><thead><tr><th>Cale</th><th>Cine / drept</th></tr></thead><tbody>${out.join('')}</tbody></table>`;
    };
  };
  render();
}

/* ---------- rutare ---------- */
async function route() {
  if (!state.st) { viewStart(); return; }
  if (state.mode === 'SharePoint' && location.hash === '#identitate') { location.hash = '#fise'; return; }
  if (!state.user || location.hash === '#identitate') { await viewIdentity(); return; }
  const h = location.hash.replace(/^#/, '') || 'fise';
  const [v, ...rest] = h.split('/');
  try {
    if (v === 'fisa') await viewFisa(decodeURIComponent(rest.join('/')));
    else if (v === 'bord') await viewBord();
    else if (v === 'repartizare') await viewRepartizare(rest[0]);
    else if (v === 'admin') await viewAdmin();
    else await viewFise();
  } catch (e) { console.error(e); $('#app').innerHTML = `<div class="card"><p class="warn">Eroare: ${esc(e.message)}</p></div>`; }
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
window.addEventListener('DOMContentLoaded', async () => {
  const q = new URLSearchParams(location.search);
  const cfg = CONFIG();
  if (cfg.mockToken || (window.Graph.Auth.configured(cfg) && (location.hash.includes('code=') || sessionStorage.length))) {
    // mod SharePoint: token de test, sau întoarcerea de la autentificarea Microsoft / sesiune existentă
    try { if (await window.Graph.Auth.init(cfg)) { await openGraph(); return; } }
    catch (e) { console.error(e); viewStart('Conectarea la SharePoint a eșuat: ' + e.message); return; }
  }
  if (window.__SEED__ && q.get('mem') === '1') openStorage(new window.Storage_.MemStorage(window.__SEED__), 'memorie');
  else if (window.__SEED__ && q.get('opfs') === '1') {
    // test automat al adaptorului FSStorage pe Origin Private File System (același API ca folderul ales de utilizator)
    const root = await navigator.storage.getDirectory();
    const st = new window.Storage_.FSStorage(root);
    for (const [p, v] of Object.entries(window.__SEED__)) { if (typeof v === 'string') await st.writeText(p, v); else await st.writeBinary(p, v); }
    openStorage(st, 'local (test OPFS)');
  } else route();
});
window.App = { state, route, scanStates, can };
